apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketflow-config
data:
  SPRING_PROFILES_ACTIVE: kubernetes
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketflow
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  SERVER_PORT: "8080"

  # Latency SLI support. The SLI in docs/SLO.md counts requests below an exact bucket
  # edge, so the 800ms boundary has to exist in the histogram. Spring Boot does not
  # create it by default: percentiles-histogram publishes the buckets, and the explicit
  # slo list adds the boundaries the SLI and its alerts read.
  # Without the 800ms entry, http_server_requests_seconds_bucket{le="0.8"} is absent and
  # the latency alerts can never fire. TicketFlowLatencyBucketMissing watches for that.
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES_HISTOGRAM_HTTP_SERVER_REQUESTS: "true"
  MANAGEMENT_METRICS_DISTRIBUTION_SLO_HTTP_SERVER_REQUESTS: 200ms,500ms,800ms,1s,2s
  MANAGEMENT_METRICS_DISTRIBUTION_MINIMUM_EXPECTED_VALUE_HTTP_SERVER_REQUESTS: 10ms
  MANAGEMENT_METRICS_DISTRIBUTION_MAXIMUM_EXPECTED_VALUE_HTTP_SERVER_REQUESTS: 5s

  # Baseline pool size. The pool-saturation experiment overrides this to a deliberately
  # small value and then restores it; see chaos/saturate-db-pool.sh.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
